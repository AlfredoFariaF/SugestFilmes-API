services:
  mysql:
    image: mysql:8.4
    container_name: sugestfilmes-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sugestfilmes
      MYSQL_USER: mvc_user
      MYSQL_PASSWORD: mvc123
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  tomcat:
    build: .
    container_name: sugestfilmes-api
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8"
      DB_URL: "jdbc:mysql://mysql:3306/sugestfilmes?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Sao_Paulo&useSSL=false&allowPublicKeyRetrieval=true"
      DB_USER: mvc_user
      DB_PASSWORD: mvc123
      JWT_SECRET: "8fK2vQ9mL4xR7pN3wY6aB1cD5eH0jT8uG2zF9kM6sP4vX1qA"
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
